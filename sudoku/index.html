<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="ALPHA-11 SUDOKU" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA-11 SUDOKU" />
    <title>ALPHA-11 SUDOKU</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="lab-body">
    <div class="stage vin-stage">
      <header class="hud vin-hud">
        <a class="hud-brand" href="/">
          <span>ALPHA-11 SUDOKU</span>
        </a>
        <div class="hud-scores">
          <div>
            <span class="lbl">NIVEL</span>
            <b id="sudo-status">fácil</b>
          </div>
          <div class="hud-split"></div>
          <div>
            <span class="lbl">HECHOS</span>
            <b id="best">0</b>
          </div>
        </div>
        <a class="vin-mini" href="/">HUB</a>
      </header>
      <div class="sudo-diffs">
        <button type="button" data-diff="easy" class="is-on">Fácil</button>
        <button type="button" data-diff="medium">Medio</button>
        <button type="button" data-diff="hard">Difícil</button>
      </div>
      <div id="sudo-board" class="sudo-board"></div>
      <div class="sudo-nums">
        <button type="button" data-num="1">1</button>
        <button type="button" data-num="2">2</button>
        <button type="button" data-num="3">3</button>
        <button type="button" data-num="4">4</button>
        <button type="button" data-num="5">5</button>
        <button type="button" data-num="6">6</button>
        <button type="button" data-num="7">7</button>
        <button type="button" data-num="8">8</button>
        <button type="button" data-num="9">9</button>
        <button type="button" id="sudo-clear">Borrar</button>
      </div>
      <div class="overlay" id="overlay-over" hidden>
        <div class="panel">
          <p class="eyebrow">ALPHA-11 SUDOKU</p>
          <p class="fin">OK</p>
          <p class="over-score" id="over-score"></p>
          <button type="button" id="retry">OTRO</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/sudoku.ts"></script>
  </body>
</html>
