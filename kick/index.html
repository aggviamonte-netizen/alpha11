<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="ALPHA-11 KICK — penaltis" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA-11 KICK" />
    <title>ALPHA-11 KICK</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="lab-body kick-body">
    <div class="stage">
      <header class="hud">
        <div class="hud-brand">
          <svg class="beaker" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M3.2 11.2 8 3.4l4.8 7.8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="8" cy="12.2" r="1.5" fill="currentColor" />
          </svg>
          <span>ALPHA-11 KICK</span>
        </div>
        <div class="hud-scores">
          <div>
            <span class="lbl">RACHA</span>
            <b id="score">0</b>
          </div>
          <div class="hud-split"></div>
          <div>
            <span class="lbl">BEST</span>
            <b id="best">0</b>
          </div>
        </div>
        <div class="hud-next">
          <span class="lbl">TIRA</span>
          <div class="next-chip kick-chip" id="next-chip"></div>
          <span class="next-code" id="next-code">KICK</span>
        </div>
      </header>
      <div id="game"></div>
      <p class="drop-hint" id="drop-hint" hidden>ARRASTRA · TOCA</p>
      <div class="overlay" id="overlay-start">
        <div class="panel start-panel">
          <p class="eyebrow">ALPHA-11</p>
          <h1>KICK</h1>
          <p class="toca">TOCA</p>
        </div>
      </div>
      <div class="overlay" id="overlay-over" hidden>
        <div class="panel over-panel">
          <p class="eyebrow">ALPHA-11 KICK</p>
          <p class="fin">FIN</p>
          <p class="record" id="over-record" hidden>NUEVO RÉCORD</p>
          <p class="over-score" id="over-score"></p>
          <button type="button" id="retry">REINTENTAR</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/kick.ts"></script>
  </body>
</html>
