<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="ALPHA-11 JUMP — nave y disparo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA-11 JUMP" />
    <title>ALPHA-11 JUMP</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="lab-body">
    <div class="stage">
      <header class="hud">
        <div class="hud-brand">
          <svg class="beaker" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M3 11.5c2.2-1.6 3.2-4.6 3.2-7.2V3h3.6v1.3c0 2.6 1 5.6 3.2 7.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
            <path d="M4.2 12.2h7.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <span>ALPHA-11 JUMP</span>
        </div>
        <div class="hud-scores">
          <div>
            <span class="lbl">PTS</span>
            <b id="score">0</b>
          </div>
          <div class="hud-split"></div>
          <div>
            <span class="lbl">BEST</span>
            <b id="best">0</b>
          </div>
        </div>
        <div class="hud-next">
          <span class="lbl">NAVE</span>
          <div class="next-chip jump-chip" id="next-chip"></div>
          <span class="next-code" id="next-code">PULSO</span>
        </div>
      </header>
      <div id="game"></div>
      <p class="drop-hint" id="play-hint" hidden>ARRASTRA · DISPARO</p>
      <button type="button" id="fire" class="fire-pad" hidden>DISPARO</button>
      <div class="overlay" id="overlay-start">
        <div class="panel start-panel">
          <p class="eyebrow">ALPHA-11</p>
          <h1>JUMP</h1>
          <p class="toca">ARRASTRA PARA VOLAR</p>
          <p class="toca-sub">TOCA O DISPARO PARA DISPARAR</p>
        </div>
      </div>
      <div class="overlay" id="overlay-over" hidden>
        <div class="panel over-panel">
          <p class="eyebrow">ALPHA-11 JUMP</p>
          <p class="fin">FIN</p>
          <p class="record" id="over-record" hidden>NUEVO RÉCORD</p>
          <p class="over-score" id="over-score"></p>
          <button type="button" id="retry">REINTENTAR</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/jump.ts"></script>
  </body>
</html>
