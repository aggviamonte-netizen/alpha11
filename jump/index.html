<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="ALPHA-11 JUMP — runner" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA-11 JUMP" />
    <title>ALPHA-11 JUMP</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="lab-body">
    <div class="stage">
      <header class="hud hud-simple">
        <div>
          <div class="title">ALPHA-11 JUMP</div>
          <div class="next" id="hint">A5 Pulse</div>
        </div>
        <div class="stats">
          <div>Dist <b id="score">0</b></div>
          <div>Mejor <b id="best">0</b></div>
        </div>
      </header>
      <div id="game"></div>
      <div class="overlay" id="overlay-start">
        <div class="panel start-panel">
          <p class="eyebrow">ALPHA-11</p>
          <h1>JUMP</h1>
          <p class="toca">TOCA</p>
        </div>
      </div>
      <div class="overlay" id="overlay-over" hidden>
        <div class="panel over-panel">
          <p class="eyebrow">ALPHA-11 JUMP</p>
          <p class="fin">FIN</p>
          <p class="over-score" id="over-score"></p>
          <button type="button" id="retry">REINTENTAR</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/jump.ts"></script>
