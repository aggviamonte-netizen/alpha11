<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="ALPHA-11 — hub, LAB, JUMP, SHIFT, RUSH y SNIPER" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA-11" />
    <title>ALPHA-11</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <h1 class="logo">ALPHA<span>-11</span></h1>
      <p class="tagline">laboratorio casual</p>
      <section class="games">
        <a class="game-card" data-game="lab" href="/lab/">
          <span class="game-orb" id="orb-lab" aria-hidden="true"></span>
          <span class="game-meta">
            <strong>LAB</strong>
            <em>merge</em>
          </span>
          <span class="game-go">JUGAR</span>
        </a>
        <a class="game-card" data-game="jump" href="/jump/">
          <span class="game-orb" id="orb-jump" aria-hidden="true"></span>
          <span class="game-meta">
            <strong>JUMP</strong>
            <em>flap</em>
          </span>
          <span class="game-go">JUGAR</span>
        </a>
        <a class="game-card" data-game="shift" href="/shift/">
          <span class="game-orb" id="orb-shift" aria-hidden="true"></span>
          <span class="game-meta">
            <strong>SHIFT</strong>
            <em>2048</em>
          </span>
          <span class="game-go">JUGAR</span>
        </a>
        <a class="game-card" data-game="rush" href="/rush/">
          <span class="game-orb blok-orb" id="orb-rush" aria-hidden="true"></span>
          <span class="game-meta">
            <strong>RUSH</strong>
            <em>velocidad</em>
          </span>
          <span class="game-go">JUGAR</span>
        </a>
        <a class="game-card" data-game="sniper" href="/sniper/">
          <span class="game-orb" id="orb-sniper" aria-hidden="true"></span>
          <span class="game-meta">
            <strong>SNIPER</strong>
            <em>mira</em>
          </span>
          <span class="game-go">JUGAR</span>
        </a>
      </section>
      <div class="canon-row" id="canon-row" aria-hidden="true"></div>
      <p class="foot">Gratis · Añade a inicio de pantalla</p>
    </main>
    <script type="module" src="/src/hub.ts"></script>
  </body>
</html>
