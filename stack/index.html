<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="ALPHA-11 STACK — bloques" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALPHA-11 STACK" />
    <title>ALPHA-11 STACK</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="lab-body">
    <div class="stage vin-stage">
      <header class="hud vin-hud">
        <a class="hud-brand" href="/">
          <span>ALPHA-11 STACK</span>
        </a>
        <div class="hud-scores">
          <div>
            <span class="lbl">SCORE</span>
            <b id="score">0</b>
          </div>
          <div class="hud-split"></div>
          <div>
            <span class="lbl">BEST</span>
            <b id="best">0</b>
          </div>
        </div>
        <div class="hud-next">
          <span class="lbl">NEXT</span>
          <canvas id="next-piece" width="72" height="72"></canvas>
          <span class="next-code" id="lines">0</span>
        </div>
      </header>
      <div class="vin-board-wrap">
        <canvas id="game-board" width="260" height="520"></canvas>
      </div>
      <p class="vin-meta">nv <b id="level">1</b> · filas</p>
      <div class="vin-pad">
        <button type="button" id="btn-left" class="vin-key">◀</button>
        <button type="button" id="btn-down" class="vin-key">▼</button>
        <button type="button" id="btn-right" class="vin-key">▶</button>
        <button type="button" id="btn-rotate" class="vin-key vin-key-acc">GIRO</button>
        <button type="button" id="btn-drop" class="vin-key vin-key-acc">CAE</button>
      </div>
      <div class="overlay" id="overlay-start">
        <div class="panel">
          <p class="eyebrow">ALPHA-11</p>
          <h1>STACK</h1>
          <p class="toca">TOCA PARA APILAR</p>
        </div>
      </div>
      <div class="overlay" id="overlay-pause" hidden>
        <div class="panel">
          <p class="eyebrow">STACK</p>
          <p class="fin">PAUSA</p>
          <p class="toca">TOCA PARA SEGUIR</p>
        </div>
      </div>
      <div class="overlay" id="overlay-over" hidden>
        <div class="panel">
          <p class="eyebrow">ALPHA-11 STACK</p>
          <p class="fin">FIN</p>
          <p class="record" id="over-record" hidden>NUEVO RÉCORD</p>
          <p class="over-score" id="over-score"></p>
          <button type="button" id="retry">REINTENTAR</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/stack.ts"></script>
  </body>
</html>
